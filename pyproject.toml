[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "contextveil"
version = "0.2.0"
description = "Local text de-identification with consistent entities and explicit fidelity checks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.urls]
Repository = "https://github.com/K-kiron/contextveil"
Issues = "https://github.com/K-kiron/contextveil/issues"
Documentation = "https://github.com/K-kiron/contextveil#readme"

[project.optional-dependencies]
nlp = ["spacy>=3.8,<4"]
neural = ["gliner==0.2.24", "transformers==4.57.6", "torch>=2.8,<2.9", "sentencepiece>=0.2,<0.3", "protobuf>=5"]
benchmark = ["scikit-learn==1.9.1", "pyarrow==26.0.0"]
formats = ["PyYAML>=6,<7", "pypdf>=6,<7"]
vault = ["cryptography>=43"]
dev = ["pytest>=8", "ruff>=0.11", "build>=1"]

[project.scripts]
contextveil = "contextveil.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
